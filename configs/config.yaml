app:
  ui_version: "1.3.0"

bluetooth:
  device_names:
    - "MSM"
    - "MSM_C16"
  target_device: "MSM"
  mac_address: ""  # 可选：直接指定 MAC；为空则按名称扫描
  scan:
    max_retries: 10
    retry_interval_sec: 1.0
  gatt:
    # notify 与 write 的特征值（可以使用 handle 或 uuid；默认取旧版脚本的 handle）
    notify_char_handle: 5
    write_char_handle: 8
  commands:
    init: []
    start_eeg: [0x02, 0x01]
    stop_eeg: [0x02, 0x02]
    start_impedance: [0x03, 0x01]
    stop_impedance: [0x03, 0x02]
    start_tdcs: [0x07, 0x01]
    stop_tdcs: [0x07, 0x02]

eeg:
  # 预留 8/16 通道版本切换接口：8 或 16
  mode_channels: 8
  sampling_rate_hz: 500
  channel_names:
    - "P3"
    - "PO4"
    - "P7"
    - "PO8"
    - "PO7"
    - "P8"
    - "PO3"
    - "P4"
  ref_channel_name: "Pz"
  lsl:
    stream_name: "BHB-EEG"
    stream_type: "EEG"
    include_trigger_channel: true

protocol:
  # 8通道默认协议参数（根据文档 CH8(带tDCS)底层FPGA操作指令及帧格式V1.0.docx 配置，总长 140 bytes）
  frame:
    header_len_bytes: 3    # 帧头 2 字节 (0xAA 0xBB) + 帧序号 1 字节
    bytes_per_sample_per_channel: 3
    samples_per_frame: 5
    trigger_len_bytes: 1
    imu_len_bytes: 12
    battery_len_bytes: 2
    tail_len_bytes: 2      # 校验段 1 字节 (SUM) + 帧尾 1 字节 (0xCC)

server:
  host: "127.0.0.1"
  port: 8001

streaming:
  # WebSocket 发送刷新频率，用于节流，防止前端渲染过载卡死
  update_fps: 50
  # 每次推送的采样点数；若为 0，则自动按 sampling_rate_hz / update_fps 计算
  buffer_size: 0
  # LSL 解析等待与重试（用于处理“先启动采集、LSL 流稍后才出现”的情况）
  lsl_resolve_timeout_sec: 1.0
  lsl_resolve_retry_interval_sec: 0.5

debug:
  # 上位机调试界面：仅展示调试事件（如收到EEG长度、发送/接收指令等），不展示网络/蓝牙连接信息
  ui_enabled: true
  max_events: 500

offline:
  root_dir: "offlinedata"
  export:
    physical_unit: "uV"
    uv_per_count: 0.0833
    trigger_label: "TRIG"
  filter:
    order: 5
    lowcut_hz_default: 0.5
    highcut_hz_default: 80.0
