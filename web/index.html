<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHB-EEG Station</title>
    <!-- 引入 ECharts 库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --danger-color: #da3633;
            --border-color: #30363d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: 600;
        }

        button:hover {
            background-color: var(--border-color);
        }

        #btn-start {
            color: var(--success-color);
            border-color: var(--success-color);
        }

        #btn-start:hover {
            background-color: var(--success-color);
            color: #ffffff;
        }

        #btn-stop {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        #btn-stop:hover {
            background-color: var(--danger-color);
            color: #ffffff;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .debug-panel {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            height: 260px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }

        .debug-title {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 0.95rem;
        }

        .debug-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .debug-controls input {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.35rem 0.6rem;
            border-radius: 4px;
            width: 220px;
        }

        .debug-controls button {
            padding: 0.35rem 0.8rem;
            font-size: 0.9rem;
        }

        .debug-log {
            flex: 1;
            overflow: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            white-space: pre;
            tab-size: 4;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        main {
            flex: 1;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto; /* 波形区垂直滚动 */
        }

        .chart-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 180px; /* 固定高度，使其成为单列多行 */
            flex-shrink: 0;
        }

        .chart-title {
            position: absolute;
            top: 0.5rem;
            left: 1rem;
            font-size: 0.8rem;
            color: var(--accent-color);
            z-index: 10;
        }

        .echarts-instance {
            width: 100%;
            height: 100%;
        }

        #status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #6e7681;
            box-shadow: 0 0 5px #6e7681;
        }

        .status-dot.active {
            background-color: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .status-dot.error {
            background-color: var(--danger-color);
            box-shadow: 0 0 8px var(--danger-color);
        }
    </style>
</head>
<body>

<header>
    <div class="title">BHB-SSVEP Station</div>
    <div id="status-indicator">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">设备未连接</span>
    </div>
    <div class="controls">
        <button id="btn-start">开始采集</button>
        <button id="btn-stop" disabled>停止采集</button>
    </div>
</header>

<div class="content">
    <div class="debug-panel">
        <div class="debug-header">
            <div class="debug-title">输出</div>
            <div class="debug-controls">
                <input id="debug-filter" placeholder="过滤关键字" />
                <button id="debug-clear">清空</button>
            </div>
        </div>
        <div class="debug-log" id="debug-log"></div>
    </div>

    <main id="charts-grid">
        <!-- 动态生成通道图表 -->
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
